<html>
    <head>
        <title>LOGIN</title>
    </head>
    <body>
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Введите имя" required>
        <button type="submit">Подтвердить</button>
    </form>
    <title>Hello from Flask</title>
            {% if person %}
            <h1>Hello {{ person }}</h1>
            {% else %}
            <h1>Hello, world!</h1>
            {% endif %}
        </body>

    </body>
</html>
